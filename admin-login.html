<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio – Connexion | DK prod Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-page">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="logo" style="justify-content:center; margin-bottom:10px; color: var(--gold);">
                DKprodStudio
            </div>
            <p>Connectez-vous pour gérer vos séances</p>
        </div>

        <div id="alertBox"></div>

        <form class="auth-form" id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group">
                <label class="form-label" for="loginUser">Identifiant</label>
                <input type="text" id="loginUser" class="form-input" placeholder="ex: admin" autocomplete="username"
                    required />
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPass">Mot de passe</label>
                <input type="password" id="loginPass" class="form-input" placeholder="••••••••"
                    autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">
                <span>Se connecter</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </form>

        <p class="auth-footer-link">
            <small>Identifiant par défaut : <strong>admin</strong> / <strong>studio123</strong></small>
        </p>
        <p class="auth-footer-link">
            <a href="index.html">← Retour à l'accueil clients</a>
        </p>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // If already logged in, redirect
        (async () => {
            const auth = await verifyAuth();
            if (auth.valid) {
                window.location.href = 'admin.html';
            }
        })();

        async function doLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const box = document.getElementById('alertBox');

            try {
                const result = await login(user, pass);
                if (result.token) {
                    showToast('Connexion réussie !', 'success');
                    setTimeout(() => window.location.href = 'admin.html', 600);
                }
            } catch (error) {
                box.innerHTML = '<div class="alert alert-error">⚠ Identifiant ou mot de passe incorrect.</div>';
                setTimeout(() => box.innerHTML = '', 3000);
            }
        }
    </script>
</body>

</html>
