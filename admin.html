<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de Bord | DK Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body style="background:var(--dark-2);">

    <div id="appRoot"></div>

    <!-- Create Session Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal glass-card">
            <div class="modal-header">
                <h3 class="modal-title">Nouvelle Séance</h3>
                <button class="btn-icon" onclick="closeModal()" title="Fermer">✕</button>
            </div>
            <div id="modalAlert"></div>
            <form id="createForm" onsubmit="handleCreateSession(event)">
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div class="form-group">
                        <label class="form-label">Nom du client *</label>
                        <input type="text" id="clientName" class="form-input" placeholder="ex: Marie Dupont" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Type de séance</label>
                        <select id="sessionType" class="form-input">
                            <option>Portrait</option>
                            <option>Famille</option>
                            <option>Mariage</option>
                            <option>Bébé / Grossesse</option>
                            <option>Professionnel</option>
                            <option>Mode / Beauté</option>
                            <option>Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Note interne</label>
                        <input type="text" id="sessionNote" class="form-input" placeholder="optionnel" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Durée de validité (jours)</label>
                        <input type="number" id="sessionExpiry" class="form-input" value="30" min="1" max="365" />
                    </div>
                    <button type="submit" class="btn-primary" style="justify-content:center;">
                        ✨ Créer la séance &amp; générer un code
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal glass-card" style="max-width:620px;">
            <div class="modal-header">
                <h3 class="modal-title" id="uploadModalTitle">Ajouter des photos</h3>
                <button class="btn-icon" onclick="closeUploadModal()">✕</button>
            </div>
            <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
                ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                <div class="upload-icon">📷</div>
                <div class="upload-text">
                    <strong>Cliquez ou glissez vos photos ici</strong><br />
                    JPG, PNG, WEBP · Max 20 Mo par photo
                </div>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFileSelect(event)" />
            <div id="uploadPreview" class="photo-grid" style="max-height:260px;overflow-y:auto;"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                <span id="uploadCount" style="color:var(--text-muted);font-size:.85rem;"></span>
                <button class="btn-primary" id="confirmUpload" onclick="confirmUpload()"
                    style="justify-content:center;">
                    ✓ Enregistrer les photos
                </button>
            </div>
        </div>
    </div>

    <!-- Code Revealed Modal -->
    <div class="modal-overlay" id="codeModal">
        <div class="modal glass-card" style="max-width:440px;text-align:center;">
            <div style="font-size:3rem;margin-bottom:8px;">🎉</div>
            <h3 class="modal-title" style="text-align:center;">Séance créée !</h3>
            <p style="color:var(--text-muted);font-size:.9rem;">Code d'accès client :</p>
            <div class="code-pill" id="revealedCode"
                style="margin:16px auto;font-size:2rem;text-align:center;cursor:pointer;" onclick="copyCode()"></div>
            <p style="color:var(--text-muted);font-size:.8rem;margin-top:-8px;">Cliquez pour copier</p>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
                <button class="btn-secondary" onclick="goToSession()">📸 Ajouter des photos maintenant</button>
                <button class="btn-primary"
                    onclick="document.getElementById('codeModal').classList.remove('open')">OK</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
